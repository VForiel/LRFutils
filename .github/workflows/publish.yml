name: Publish

# A published GitHub release uploads the package to PyPI by trusted publishing (no token): the LRFutils project on
# PyPI declares this repository, this workflow (publish.yml) and the environment "pypi" as a trusted publisher.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
