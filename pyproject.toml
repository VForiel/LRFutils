[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "LRFutils"
version = "0.2.0"
description = "Small tools for everyday scientific work: run archives, editable matplotlib figures, terminal helpers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vincent Foriel", email = "vincent.foriel@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.22",
    "PyYAML>=6.0",
]
keywords = ["science", "archiving", "matplotlib", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = ["sphinx>=7", "sphinx-breeze-theme>=0.13", "myst-parser>=3"]

[project.scripts]
pltedit = "LRFutils.pltedit._cli:main"

[project.urls]
Homepage = "https://github.com/VForiel/LRFutils"
Documentation = "https://lrfutils.readthedocs.io"
Changelog = "https://lrfutils.readthedocs.io/en/latest/changelog.html"
Issues = "https://github.com/VForiel/LRFutils/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"LRFutils.pltedit" = ["desktop/*.js", "desktop/*.json", "desktop/*.py", "desktop/renderer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
